name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches tag
        run: |
          JSON_VERSION=$(jq -r .version plugin.json)
          if [ "$JSON_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "plugin.json version ($JSON_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build plugin zip
        id: build
        run: |
          PLUGIN_ID=$(jq -r .id plugin.json)
          echo "plugin_id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/build/"$PLUGIN_ID"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='update.json' \
            ./ /tmp/build/"$PLUGIN_ID"/
          (cd /tmp/build && zip -r "$GITHUB_WORKSPACE/${PLUGIN_ID}.zip" "$PLUGIN_ID")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.build.outputs.plugin_id }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Update update.json
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.build.outputs.plugin_id }}.zip"
          jq --arg v "${{ steps.version.outputs.version }}" --arg u "$DOWNLOAD_URL" \
            '.["*"].version = $v | .["*"].download_url = $u' update.json > update.json.tmp
          mv update.json.tmp update.json

      - name: Commit update.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore: update.json for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
